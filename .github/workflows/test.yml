name: test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reviewer-audit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile source
        run: python -m compileall -q src tools tests paper/scripts

      - name: Verify synthetic metric audit
        run: >-
          python tools/audit_metrics.py
          --input examples/synthetic_metric_audit/predictions.csv
          --check examples/synthetic_metric_audit/expected_summary.json

      - name: Verify release and privacy boundary
        run: python tools/verify_release.py

      - name: Run tests
        run: python -m unittest discover -s tests -v
