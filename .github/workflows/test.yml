name: test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reviewer-audit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Compile source
        run: python -m compileall -q src tools tests paper/scripts

      - name: Verify synthetic metric audit
        run: >-
          python tools/audit_metrics.py
          --input examples/synthetic_metric_audit/predictions.csv
          --check examples/synthetic_metric_audit/expected_summary.json

      - name: Verify release and privacy boundary
        run: python tools/verify_release.py

      - name: Run tests
        run: python -m unittest discover -s tests -v
