# PruScope-M: scale-selective P2-P5 detector for whole-cycle Prunus phenotyping.
# The architecture is fixed to the YOLO26 medium scale for reproducible ablations.

nc: 1
end2end: true
reg_max: 1
scale: m
scales:
  m: [0.50, 1.00, 512]

backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]                    # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]                   # 1-P2/4
  - [-1, 2, C3k2, [256, false, 0.25]]            # 2
  - [-1, 1, Conv, [256, 3, 2]]                   # 3-P3/8
  - [-1, 2, C3k2, [512, false, 0.25]]            # 4
  - [-1, 1, Conv, [512, 3, 2]]                   # 5-P4/16
  - [-1, 2, C3k2, [512, true]]                   # 6
  - [-1, 1, Conv, [1024, 3, 2]]                  # 7-P5/32
  - [-1, 2, C3k2, [1024, true]]                  # 8
  - [-1, 1, SPPF, [1024, 5, 3, true]]            # 9
  - [-1, 2, C2PSA, [1024]]                       # 10

head:
  # Preserve the complete, pretrained P3-P5 PAN path.
  - [-1, 1, nn.Upsample, [null, 2, nearest]]      # 11
  - [[-1, 6], 1, Concat, [1]]                    # 12
  - [-1, 2, C3k2, [512, true]]                   # 13
  - [-1, 1, nn.Upsample, [null, 2, nearest]]      # 14
  - [[-1, 4], 1, Concat, [1]]                    # 15
  - [-1, 2, C3k2, [256, true]]                   # 16 P3 top-down
  - [-1, 1, Conv, [256, 3, 2]]                   # 17
  - [[-1, 13], 1, Concat, [1]]                   # 18
  - [-1, 2, C3k2, [512, true]]                   # 19 P4
  - [-1, 1, Conv, [512, 3, 2]]                   # 20
  - [[-1, 10], 1, Concat, [1]]                   # 21
  - [-1, 1, C3k2, [1024, true, 0.5, true]]       # 22 P5

  # Non-invasive microfruit branch: it adds P2 without perturbing P3-P5.
  - [16, 1, nn.Upsample, [null, 2, nearest]]      # 23
  - [[-1, 2], 1, Concat, [1]]                    # 24
  - [-1, 2, C3k2, [128, true]]                   # 25 P2
  - [-1, 1, OrchardScaleSelectiveAttention, [128, 8, 7]] # 26
  - [16, 1, OrchardScaleSelectiveAttention, [256, 8, 7]] # 27 P3 refinement

  - [[26, 27, 19, 22], 1, Detect, [nc]]          # 28 process-locally replaced by PruScope head
